name: anime-qqbot

x-app: &app
  image: anime-qqbot:${IMAGE_TAG:-latest}
  build:
    context: .
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://anime:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/anime
  init: true
  restart: unless-stopped
  stop_grace_period: 20s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: anime
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime -d anime"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5

  napcat:
    image: napcat/napcat:3.6.0
    environment:
      ASTRBOT_REVERSE_WS: ws://astrbot:6199/ws
      ASTRBOT_REVERSE_TOKEN: ${ONEBOT_TOKEN:-change-me}
    volumes:
      - napcat-data:/app/data
      - napcat-config:/app/config
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped
    depends_on:
      - astrbot

  astrbot:
    build:
      context: .
      dockerfile: Dockerfile.astrbot
    image: anime-astrbot:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://anime:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/anime
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - astrbot-data:/app/data
      - astrbot-plugins:/app/plugin
    ports:
      - "127.0.0.1:6180:6180"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  napcat-data:
  napcat-config:
  astrbot-data:
  astrbot-plugins:
