name: anime-qqbot

x-runtime: &runtime
  image: ${APP_IMAGE:-crpi-thkewd16qu1tdfsq.cn-shenzhen.personal.cr.aliyuncs.com/stonesver/anime-qqbot}:${IMAGE_TAG:-latest}
  build:
    context: .

x-app: &app
  <<: *runtime
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://anime:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/anime
    BANGUMI_USER_AGENT: ${BANGUMI_USER_AGENT:?BANGUMI_USER_AGENT must be set}
    BANGUMI_ACCESS_TOKEN: ${BANGUMI_ACCESS_TOKEN:-}
    BANGUMI_API_BASE_URL: ${BANGUMI_API_BASE_URL:-https://api.bgm.tv}
    BANGUMI_API_FALLBACK_URLS: ${BANGUMI_API_FALLBACK_URLS:-}
    DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Shanghai}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    BANGUMI_DATA_SYNC_SECONDS: ${BANGUMI_DATA_SYNC_SECONDS:-21600}
    WORKER_SCAN_SECONDS: ${WORKER_SCAN_SECONDS:-30}
    MIKAN_POLL_SECONDS: ${MIKAN_POLL_SECONDS:-300}
    MIKAN_BATCH_SECONDS: ${MIKAN_BATCH_SECONDS:-600}
  init: true
  restart: unless-stopped
  stop_grace_period: 20s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-crpi-thkewd16qu1tdfsq.cn-shenzhen.personal.cr.aliyuncs.com/stonesver/anime-qqbot:vendor-postgres-17.4-alpine}
    environment:
      POSTGRES_DB: anime
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime -d anime"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "anime_qqbot.entrypoints.healthcheck", "worker"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  astrbot:
    <<: *runtime
    command: ["astrbot"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://anime:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/anime
      ONEBOT_TOKEN: ${ONEBOT_TOKEN:?ONEBOT_TOKEN must be set}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - astrbot-data:/AstrBot/data
    ports:
      - "127.0.0.1:${ASTRBOT_WEBUI_PORT:-6185}:6185"
    expose:
      - "6199"
    healthcheck:
      test: ["CMD", "python", "-m", "anime_qqbot.entrypoints.healthcheck", "astrbot"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  napcat:
    image: ${NAPCAT_IMAGE:-crpi-thkewd16qu1tdfsq.cn-shenzhen.personal.cr.aliyuncs.com/stonesver/anime-qqbot:vendor-napcat-v4.18.13}
    entrypoint: ["/bin/bash", "/usr/local/bin/anime-napcat-entrypoint"]
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      ONEBOT_TOKEN: ${ONEBOT_TOKEN:?ONEBOT_TOKEN must be set}
    volumes:
      - napcat-qq:/app/.config/QQ
      - napcat-config:/app/napcat/config
      - ./scripts/napcat-entrypoint.sh:/usr/local/bin/anime-napcat-entrypoint:ro
    ports:
      - "127.0.0.1:${NAPCAT_WEBUI_PORT:-6099}:6099"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6099'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    depends_on:
      astrbot:
        condition: service_healthy

volumes:
  postgres-data:
  astrbot-data:
  napcat-qq:
  napcat-config:
